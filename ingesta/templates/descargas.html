{% extends 'base.html' %}
{% block titulo %}Descargas{% endblock %}
{% block contenido %}
<div class="barra"><div>
  <h1 class="titulo">Descargas</h1>
  <div class="sub">De a una, con pausa entre álbumes. Mientras un álbum se descarga, la ingesta no lo revisa; al terminar pasa solo a la Bandeja.</div>
</div>
  <div class="acciones" style="margin:0"><a class="btn" href="{{ url_for('buscar_pagina') }}">Buscar más</a></div>
</div>
<div id="d-lista"><div class="vacio"><p>Cargando…</p></div></div>
{% endblock %}
{% block js %}
<script>
(function () {
  const NOMBRE = {qobuz: 'Qobuz', tidal: 'Tidal'};
  const ESTADO = {en_cola: 'En cola', descargando: 'Descargando', terminada: 'Descargada', error: 'Error', cancelada: 'Cancelada',
                  decision: 'Requiere decisión', convirtiendo: 'Convirtiendo'};
  const formato = new Map();             // id → 'flac' | 'mp3' (se conserva entre refrescos)
  const BANDEJA = {copiando: 'esperando a revisarse', en_cola: 'en cola para revisar', analizando: 'revisándose',
                   revisado: 'lista para ubicar', requiere_revision: 'requiere revisión', por_ubicar: 'en cola para ubicar',
                   ubicando: 'ubicándose', por_metadata: 'en cola de metadata', metadata: 'corriendo la metadata',
                   completado: 'completa en la biblioteca', error: 'con error', error_ubicar: 'error al ubicar',
                   error_metadata: 'error en la metadata', descartado: 'descartada'};
  let abiertos = new Set();
  let ultimo = '';                          // lo último pintado: si no cambió, no se repinta (el scroll queda donde está)
  function tarjeta(d) {
    const m = /pista (\d+) de (\d+)/.exec(d.progreso || '');
    const pct = m && +m[2] ? Math.min(100, Math.round(100 * m[1] / m[2])) : null;
    const acciones = [];
    if (d.estado === 'descargando' || d.estado === 'en_cola') acciones.push(`<button class="btn chico" data-acc="cancelar" data-id="${d.id}">Cancelar</button>`);
    if (d.estado === 'error' || d.estado === 'cancelada') acciones.push(`<button class="btn chico oro" data-acc="reintentar" data-id="${d.id}">Reintentar</button>`);
    if (!['descargando', 'en_cola', 'decision', 'convirtiendo'].includes(d.estado)) acciones.push(`<button class="btn chico" data-acc="quitar" data-id="${d.id}">Quitar</button>`);
    if (d.bandeja) acciones.unshift(`<a class="btn chico" href="/album/${d.bandeja.id}">Abrir en la Bandeja</a>`);
    let detalle = '';
    if (d.estado === 'descargando') detalle = `<div class="d-barra"><div style="width:${pct ?? 5}%"></div></div><div class="tenue t-nota">${esc(d.progreso || '')}</div>`;
    else if (d.estado === 'en_cola') detalle = '<div class="tenue t-nota">En cola</div>';
    else if (d.estado === 'terminada') detalle = `<div class="ok t-nota">${esc(d.progreso || 'Descargada')}${d.bandeja ? ' · en la Bandeja: ' + esc(BANDEJA[d.bandeja.estado] || d.bandeja.estado) : ' · esperando a que la ingesta la vea'}</div>`;
    else if (d.estado === 'error') detalle = `<div class="mal t-nota">${esc(d.error || 'Error')}</div>`;
    else if (d.estado === 'convirtiendo') detalle = `<div class="d-barra"><div style="width:50%"></div></div><div class="tenue t-nota">Convirtiendo ${d.pendientes.length} pista(s)…</div>`;
    else if (d.estado === 'decision') {
      const f = formato.get(d.id) || 'flac';
      detalle = `<div class="d-decision">
        <div class="med t-nota">⚠ No existe sin pérdida ni en Tidal ni en Qobuz:</div>
        <ul class="d-pend">${d.pendientes.map(p => `<li>${esc(p.archivo)} <span class="tenue">(${esc((p.codec || '?').toUpperCase())})</span></li>`).join('')}</ul>
        <div class="tenue t-nota">Para que el álbum quede en un solo tipo de archivo, se convierten y se agrega «(Lossy)» al final de su título. No sube la calidad.</div>
        <div class="d-opc" role="radiogroup" aria-label="Convertir a">
          <label><input type="radio" name="fmt-${d.id}" value="flac" data-fmt="${d.id}" ${f === 'flac' ? 'checked' : ''}> Convertir a FLAC</label>
          <label><input type="radio" name="fmt-${d.id}" value="mp3" data-fmt="${d.id}" ${f === 'mp3' ? 'checked' : ''}> Convertir a MP3 320</label>
        </div></div>`;
      acciones.length = 0;
      acciones.push(`<button class="btn chico oro" data-acc="convertir" data-id="${d.id}">Aplicar</button>`,
                    `<button class="btn chico" data-acc="descartar" data-id="${d.id}">Descartar el disco</button>`);
    }
    else detalle = '<div class="muy-tenue t-nota">Cancelada: lo que alcanzó a bajar se borró</div>';
    return `<article class="d-item e-${esc(d.estado)}">
      <div class="d-txt"><div><b>${esc(d.artista)} — ${esc(d.album)}</b> <span class="tenue t-nota">${NOMBRE[d.servicio] || ''} · ${esc(d.calidad || '')}</span></div>
        ${detalle}
        ${d.registro ? `<details data-reg="${d.id}" ${abiertos.has(d.id) ? 'open' : ''}><summary class="muy-tenue t-nota">Registro</summary><pre class="registro">${esc(d.registro)}</pre></details>` : ''}</div>
      <div class="acciones" style="margin:0">${acciones.join('')}</div></article>`;
  }
  async function cargar() {
    let r;
    try { r = await (await fetch('/api/descargas')).json(); } catch (e) { return; }
    const el = document.getElementById('d-lista');
    el.querySelectorAll('details[data-reg]').forEach(x => { if (x.open) abiertos.add(+x.dataset.reg); else abiertos.delete(+x.dataset.reg); });
    const firma = JSON.stringify(r.descargas);
    if (firma === ultimo) return;
    ultimo = firma;
    const scroll = new Map();               // posición de cada registro abierto, para dejarla igual tras repintar
    el.querySelectorAll('details[data-reg] pre').forEach(p => {
      const id = +p.parentElement.dataset.reg;
      scroll.set(id, {top: p.scrollTop, alFinal: p.scrollTop + p.clientHeight >= p.scrollHeight - 4});
    });
    const pagina = window.scrollY;
    if (!r.descargas.length) { el.innerHTML = '<div class="vacio"><p>Todavía no hay descargas. Búscalas en «Buscar».</p></div>'; return; }
    const VIVAS = ['decision', 'convirtiendo', 'descargando', 'en_cola'];
    const vivas = r.descargas.filter(d => VIVAS.includes(d.estado)).sort((a, b) => VIVAS.indexOf(a.estado) - VIVAS.indexOf(b.estado));
    const resto = r.descargas.filter(d => !VIVAS.includes(d.estado));
    el.innerHTML = vivas.map(tarjeta).join('') +
      (resto.length ? `<div class="d-cab-term"><div class="rotulo">Terminadas</div>${resto.some(d => d.estado === 'terminada')
        ? '<button class="btn chico" id="d-limpiar" title="Quita de la lista las descargadas bien; no toca archivos ni la Bandeja">Limpiar terminadas</button>' : ''}</div>`
        + resto.map(tarjeta).join('') : '');
    el.querySelectorAll('details[data-reg] pre').forEach(p => {
      const s = scroll.get(+p.parentElement.dataset.reg);
      if (s) p.scrollTop = s.alFinal ? p.scrollHeight : s.top;      // si ibas al final, sigue al final mientras baja
    });
    window.scrollTo(0, pagina);
  }
  document.getElementById('d-lista').addEventListener('click', async e => {
    if (e.target.id === 'd-limpiar') {
      e.target.disabled = true;
      const r = await post('/api/descargas/limpiar', {});
      if (r && r.ok) toast('Listo', `${r.quitadas} descarga(s) quitadas de la lista`);
      ultimo = '';
      return cargar();
    }
    const b = e.target.closest('[data-acc]');
    if (!b) return;
    if (b.dataset.acc === 'descartar' && !confirm('Se borra lo descargado de este disco y no pasa a la Bandeja. ¿Seguir?')) return;
    b.disabled = true;
    const r = await post(`/api/descargas/${b.dataset.id}/${b.dataset.acc}`,
                         b.dataset.acc === 'convertir' ? {formato: formato.get(+b.dataset.id) || 'flac'} : {});
    if (r && r.ok === false) toast('No se pudo', r.error || '');
    cargar();
  });
  document.getElementById('d-lista').addEventListener('change', e => {
    if (e.target.dataset.fmt) formato.set(+e.target.dataset.fmt, e.target.value);
  });
  cargar();
  setInterval(cargar, 2500);
})();
</script>
{% endblock %}
