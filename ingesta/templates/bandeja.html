{% extends 'base.html' %}
{% block titulo %}Bandeja{% endblock %}
{% block contenido %}
<div class="barra">
  <div>
    <h1 class="titulo">Bandeja</h1>
    <div class="entrada-info" id="entrada-info">Cargando…</div>
  </div>
  <button class="btn" id="btn-escanear">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    Revisar ahora
  </button>
</div>
<div id="aviso-entrada"></div>
<div class="filtros" id="filtros"></div>
<div class="lista" id="lista"></div>
{% endblock %}
{% block js %}
<script>
const NOMBRES = {copiando: 'Esperando', en_cola: 'En cola', analizando: 'Revisando',
                 revisado: 'Lista', requiere_revision: 'Requiere revisión', error: 'Con errores', descartado: 'Descartado',
                 por_ubicar: 'En cola para ubicar', ubicando: 'Ubicando', ubicado: 'Ubicado',
                 por_metadata: 'En cola: metadata', metadata: 'Metadata', completado: 'Completo',
                 error_ubicar: 'Error al ubicar', error_metadata: 'Error en metadata',
                 por_ajustar: 'En cola: ajustar tags', ajustando: 'Ajustando tags'};
const VIVOS = ['copiando', 'en_cola', 'analizando', 'por_ubicar', 'ubicando', 'por_metadata', 'metadata',
               'por_ajustar', 'ajustando'];
const ACTIVOS = ['copiando', 'en_cola', 'analizando', 'revisado', 'requiere_revision', 'error',
                 'por_ubicar', 'ubicando', 'ubicado', 'por_metadata', 'metadata', 'error_ubicar', 'error_metadata',
                 'por_ajustar', 'ajustando'];
const FILTROS = [['todos', 'Bandeja', ACTIVOS], ['requiere_revision', 'Requieren revisión', ['requiere_revision']],
                 ['revisado', 'Listas', ['revisado']], ['error', 'Con errores', ['error', 'error_ubicar', 'error_metadata']],
                 ['proceso', 'En proceso', VIVOS], ['completado', 'Completos', ['completado']],
                 ['descartado', 'Descartados', ['descartado']]];
const NIVEL_COLOR = {error: 'var(--error)', decision: 'var(--decision)', correccion: 'var(--correccion)', aviso: 'var(--aviso)'};
const NIVEL_NOMBRE = {error: ['error', 'errores'], decision: ['decisión', 'decisiones'],
                      correccion: ['corrección', 'correcciones'], aviso: ['aviso', 'avisos']};
const ICONO_DISCO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>';
let filtro = 'todos', datos = null, temporizador = null;
try { filtro = localStorage.getItem('ingesta.filtro') || 'todos'; } catch (e) {}

function hace(ts, ahora) {
  if (!ts) return 'nunca';
  const s = Math.max(0, Math.round(ahora - ts));
  if (s < 60) return `hace ${s} s`;
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  return `hace ${Math.round(s / 3600)} h`;
}

function pintar() {
  const d = datos;
  const info = document.getElementById('entrada-info');
  info.innerHTML = d.entrada
    ? `Carpeta de entrada <span class="mono">${esc(d.entrada)}</span> <span>revisada ${hace(d.ultimo_escaneo, d.ahora)}</span>`
    : 'Sin carpeta de entrada';
  const av = document.getElementById('aviso-entrada');
  let html = '';
  if (d.problema) html += `<div class="flash error">${esc(d.problema)} ${d.entrada ? '' : '<a href="/ajustes" style="text-decoration:underline">Elegirla</a>'}</div>`;
  if (d.biblioteca_lista === false) html += `<div class="flash error">La biblioteca (${esc(d.biblioteca || '')}) no está disponible o no se puede escribir: la cola de proceso espera a que vuelva.</div>`;
  const errUbicar = d.albumes.filter(a => a.estado === 'error_ubicar').length;
  if (errUbicar) html += `<div class="flash error" style="display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap">${errUbicar} álbum${errUbicar === 1 ? '' : 'es'} con error al ubicar (los originales no se tocaron). <button class="btn chico" id="reintentar">Volver a revisarlos</button></div>`;
  if (d.sueltos && d.sueltos.length) html += `<div class="flash">${d.sueltos.length === 1 ? 'Hay 1 archivo de audio suelto' : `Hay ${d.sueltos.length} archivos de audio sueltos`} en la raíz de la entrada (${esc(d.sueltos.slice(0, 3).join(', '))}${d.sueltos.length > 3 ? '…' : ''}). Ponlos dentro de una carpeta por álbum para revisarlos.</div>`;
  av.innerHTML = html;
  const ri = document.getElementById('reintentar');
  if (ri) ri.onclick = async () => { ri.disabled = true; await post('/api/reintentar_errores'); cargar(); };

  const fil = document.getElementById('filtros');
  fil.innerHTML = FILTROS.map(([k, n, est]) => {
    const c = est ? d.albumes.filter(a => est.includes(a.estado)).length : d.albumes.length;
    return `<button class="filtro ${filtro === k ? 'activo' : ''}" data-f="${k}">${n}<b>${c}</b></button>`;
  }).join('');
  fil.querySelectorAll('button').forEach(b => b.onclick = () => {
    filtro = b.dataset.f; try { localStorage.setItem('ingesta.filtro', filtro); } catch (e) {} pintar();
  });

  const est = (FILTROS.find(f => f[0] === filtro) || FILTROS[0])[2];
  const lista = d.albumes.filter(a => !est || est.includes(a.estado));
  const enBandeja = d.albumes.filter(a => ACTIVOS.includes(a.estado));
  const cont = document.getElementById('lista');
  if (!enBandeja.length && filtro === 'todos') {
    cont.innerHTML = `<div class="vacio">${ICONO_DISCO}<h3>La bandeja está vacía</h3>
      <p>${d.entrada ? 'Copia carpetas de álbumes a la carpeta de entrada: aparecen aquí solas y se revisan cuando termina la copia.'
                     : 'Elige en Ajustes la carpeta donde vas a dejar el material nuevo.'}</p>
      ${d.entrada ? '' : '<a class="btn oro" href="/ajustes">Ir a Ajustes</a>'}</div>`;
    return;
  }
  if (!lista.length) { cont.innerHTML = '<div class="vacio"><p>Nada con este filtro.</p></div>'; return; }
  cont.innerHTML = lista.map(a => {
    const analizado = !!a.analizado && !['copiando'].includes(a.estado) && !(a.estado === 'en_cola' && !a.album);
    const portada = analizado ? `<img loading="lazy" alt="" src="/album/${a.id}/caratula?mini=1&v=${Math.round(a.analizado)}" onerror="this.remove()">` : '';
    const titulo = a.album ? `${esc(a.album)}${a.anio ? ` <span class="art">(${esc(a.anio)})</span>` : ''}` : esc(a.rel);
    const art = a.artista ? `<span class="art">${esc(a.artista)} — </span>` : '';
    let destino = a.destino || '';
    if (d.biblioteca && destino.startsWith(d.biblioteca.replace(/\/$/, '') + '/')) destino = destino.slice(d.biblioteca.replace(/\/$/, '').length + 1);
    const dest = destino ? `<div class="f-dest" title="${esc(a.destino)}"><span class="flecha">→</span> ${esc(destino)}</div>` : '';
    const vivo = VIVOS.includes(a.estado);
    const chips = [];
    if (a.calidad) chips.push(`<span class="chip q-${a.calidad}"><span class="led"></span>${esc(a.calidad)}</span>`);
    chips.push(`<span class="chip e-${a.estado} ${vivo ? 'pulso' : ''}"><span class="led"></span>${NOMBRES[a.estado] || a.estado}</span>`);
    const conteo = a.conteo || {};
    const cuentas = ['error', 'decision', 'correccion'].filter(k => conteo[k])
      .map(k => `<span><i style="background:${NIVEL_COLOR[k]}"></i>${conteo[k]} ${NIVEL_NOMBRE[k][conteo[k] === 1 ? 0 : 1]}</span>`).join('');
    const extra = vivo && a.progreso ? `<div class="progreso">${esc(a.progreso)}</div>`
      : (a.n_pistas && analizado ? `<div class="cuentas">${cuentas}<span class="muy-tenue">${a.n_pistas} pistas</span></div>` : '');
    return `<a class="fila" href="/album/${a.id}">
      <div class="portada">${ICONO_DISCO}${portada}</div>
      <div class="f-txt"><div class="f-titulo">${art}${titulo}</div>${dest}
        <div class="f-origen">📁 ${esc(a.rel)}</div></div>
      <div class="f-der"><div class="f-chips">${chips.join('')}</div>${extra}</div></a>`;
  }).join('');
}

async function cargar() {
  clearTimeout(temporizador);
  try {
    const r = await fetch('/api/bandeja');
    if (r.status === 401) { location.href = '/login'; return; }
    datos = await r.json(); pintar();
  } catch (e) {}
  const activo = datos && datos.albumes.some(a => VIVOS.includes(a.estado));
  temporizador = setTimeout(cargar, activo ? 2500 : 15000);
}
document.getElementById('btn-escanear').onclick = async (ev) => {
  const b = ev.currentTarget; b.disabled = true;
  await post('/api/escanear'); setTimeout(() => { b.disabled = false; cargar(); }, 1200);
};
cargar();
</script>
{% endblock %}
