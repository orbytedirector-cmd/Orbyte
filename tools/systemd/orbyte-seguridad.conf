# Orbyte — restricciones de seguridad para orbyte.service (31-10-2026).
#
# Se instala como complemento del servicio (no reemplaza orbyte.service):
#   sudo mkdir -p /etc/systemd/system/orbyte.service.d
#   sudo install -m 644 tools/systemd/orbyte-seguridad.conf /etc/systemd/system/orbyte.service.d/seguridad.conf
#   sudo systemctl daemon-reload && sudo systemctl restart orbyte.service
# Para deshacer: borrar ese archivo, daemon-reload y restart.
#
# Qué queda permitido: escribir SOLO en la carpeta de Orbyte (base de datos,
# registros, versiones publicadas, venv); leer la biblioteca; toda la red
# (apps, DLNA/SSDP, MPD, LG, correo, IA); ffmpeg/sox/mpc como siempre.

[Unit]
# La biblioteca es un disco de red (CIFS): ordenar después de los montajes remotos.
After=remote-fs.target

[Service]
# Carpeta personal: invisible salvo la carpeta de Orbyte (sin ~/.ssh, llaves, etc.).
ProtectHome=tmpfs
BindPaths=/home/painx/Documentos/Orbyte-login
# Todo el sistema en solo lectura, incluida la biblioteca (/mnt/musica).
ProtectSystem=strict
ReadWritePaths=/home/painx/Documentos/Orbyte-login
ReadOnlyPaths=/mnt/musica
# Temporales propios (cachés DSD/Alexa/HLS/portadas: se recrean solos).
PrivateTmp=yes
PrivateDevices=yes
# Sin escalar permisos ni tocar el kernel, la hora o los módulos.
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
# Red: IPv4/IPv6, sockets locales y netlink (listar interfaces para DLNA/SSDP).
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# start.sh hace pip install en cada arranque: sin caché en la carpeta personal.
Environment=PIP_NO_CACHE_DIR=1
