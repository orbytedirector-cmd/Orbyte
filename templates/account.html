{% extends "base.html" %}
{% block content %}
<div class="auth-wrap" style="min-height:auto; padding-top:2.5rem;">
  <div class="auth-card">
    <h1 style="color:var(--text-primary); font-size:1.3rem; margin-bottom:0.25rem;">Mi cuenta</h1>
    <p class="auth-subtitle">{{ current_user.email }}</p>

    {% if success %}
    <div class="auth-notice auth-notice-ok">✓ {{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="auth-notice auth-notice-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <label class="auth-label" for="current_password">Contraseña actual</label>
      <input type="password" id="current_password" name="current_password" class="auth-input"
             required autocomplete="current-password">

      <label class="auth-label" for="new_password">Contraseña nueva</label>
      <input type="password" id="new_password" name="new_password" class="auth-input"
             required autocomplete="new-password" minlength="8">
      <span class="auth-hint">Mínimo 8 caracteres.</span>

      <label class="auth-label" for="new_password2">Repetir contraseña nueva</label>
      <input type="password" id="new_password2" name="new_password2" class="auth-input"
             required autocomplete="new-password" minlength="8">

      <button type="submit" class="track-btn primary auth-submit">Actualizar contraseña</button>
    </form>
  </div>

  <div class="auth-card profile-card">
    <h2 style="color:var(--text-primary); font-size:1.1rem; margin-bottom:1rem;">Perfil</h2>

    <label class="auth-label">Avatar</label>
    <div class="avatar-grid" id="avatar-grid"></div>

    <label class="auth-label" for="bio-input">Biografía</label>
    <textarea id="bio-input" class="auth-input" rows="3" maxlength="500"
              placeholder="Gustos musicales, lo que quieras contar..."></textarea>
    <button type="button" class="track-btn ghost admin-btn-sm" id="save-bio-btn" style="margin-top:0.5rem;">Guardar biografía</button>

    <label class="auth-label" style="margin-top:1.25rem;">Géneros favoritos</label>
    <div class="genre-chip-list" id="genre-list"></div>

    <label class="auth-label" style="margin-top:1.25rem;">Bandas favoritas (máximo 5)</label>
    <input type="text" id="artist-search-input" class="auth-input" placeholder="Buscar banda en tu biblioteca...">
    <div class="artist-search-results" id="artist-search-results"></div>
    <div class="favorite-artists-list" id="favorite-artists-list"></div>

    <div id="profile-status" class="auth-notice auth-notice-ok" style="display:none; margin-top:1rem;"></div>
  </div>
</div>

<script>
(function() {
  const statusEl = document.getElementById('profile-status');
  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    setTimeout(() => { statusEl.style.display = 'none'; }, 2500);
  }

  let profile = { avatar: null, bio: '', favorite_genres: [], favorite_artists: [] };
  let allAvatars = [];
  let allGenres = [];

  async function loadAll() {
    const [profileRes, avatarsRes, genresRes] = await Promise.all([
      fetch('/api/v1/profile'), fetch('/api/v1/avatars'), fetch('/api/v1/genres')
    ]);
    profile = await profileRes.json();
    allAvatars = (await avatarsRes.json()).avatars;
    allGenres = (await genresRes.json()).genres;
    document.getElementById('bio-input').value = profile.bio || '';
    renderAvatars();
    renderGenres();
    renderFavoriteArtists();
  }

  function renderAvatars() {
    const grid = document.getElementById('avatar-grid');
    grid.innerHTML = allAvatars.map(a => `
      <img src="/static/avatares/${a}" class="avatar-option ${a === profile.avatar ? 'avatar-selected' : ''}"
           data-avatar="${a}" alt="avatar">
    `).join('');
    grid.querySelectorAll('.avatar-option').forEach(img => {
      img.addEventListener('click', async () => {
        await fetch('/api/v1/profile', {
          method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({avatar: img.dataset.avatar})
        });
        profile.avatar = img.dataset.avatar;
        renderAvatars();
        showStatus('Avatar actualizado.');
      });
    });
  }

  function renderGenres() {
    const list = document.getElementById('genre-list');
    list.innerHTML = allGenres.map(g => `
      <button type="button" class="genre-chip ${profile.favorite_genres.includes(g) ? 'genre-chip-active' : ''}"
              data-genre="${g}">${g}</button>
    `).join('');
    list.querySelectorAll('.genre-chip').forEach(btn => {
      btn.addEventListener('click', async () => {
        const g = btn.dataset.genre;
        const idx = profile.favorite_genres.indexOf(g);
        if (idx === -1) profile.favorite_genres.push(g);
        else profile.favorite_genres.splice(idx, 1);
        await fetch('/api/v1/profile', {
          method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({favorite_genres: profile.favorite_genres})
        });
        renderGenres();
      });
    });
  }

  function renderFavoriteArtists() {
    const list = document.getElementById('favorite-artists-list');
    list.innerHTML = profile.favorite_artists.map(a => `
      <span class="favorite-artist-pill">${a.name}
        <button type="button" data-artist-id="${a.id}" class="favorite-artist-remove">✕</button>
      </span>
    `).join('');
    list.querySelectorAll('.favorite-artist-remove').forEach(btn => {
      btn.addEventListener('click', async () => {
        const res = await fetch(`/api/v1/profile/favorite-artists/${btn.dataset.artistId}`, {method: 'DELETE'});
        profile = await res.json();
        renderFavoriteArtists();
      });
    });
  }

  let searchTimer;
  document.getElementById('artist-search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    const resultsEl = document.getElementById('artist-search-results');
    if (q.length < 2) { resultsEl.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      const res = await fetch(`/api/v1/artists/search?q=${encodeURIComponent(q)}`);
      const { artists } = await res.json();
      resultsEl.innerHTML = artists.map(a => `
        <button type="button" class="artist-search-result" data-artist-id="${a.id}">${a.name}</button>
      `).join('') || '<span class="auth-hint">Sin resultados.</span>';
      resultsEl.querySelectorAll('.artist-search-result').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (profile.favorite_artists.length >= 5) { showStatus('Ya tenés 5 bandas favoritas — quitá una primero.'); return; }
          const res = await fetch('/api/v1/profile/favorite-artists', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({artist_id: parseInt(btn.dataset.artistId, 10)})
          });
          profile = await res.json();
          renderFavoriteArtists();
          document.getElementById('artist-search-input').value = '';
          resultsEl.innerHTML = '';
        });
      });
    }, 300);
  });

  document.getElementById('save-bio-btn').addEventListener('click', async () => {
    const bio = document.getElementById('bio-input').value;
    await fetch('/api/v1/profile', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({bio})
    });
    showStatus('Biografía guardada.');
  });

  loadAll();
})();
</script>
{% endblock %}
