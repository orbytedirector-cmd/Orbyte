<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbyte · TV</title>
<!--
  Ticket C-07 (pedido por Niko): "Modo TV". Pagina SUELTA de solo lectura que
  el servidor abre en el navegador de la tele LG (webOS) para mostrar lo que
  suena sin espejar el telefono. Sin audio: la musica sale por el receptor
  desde la app del anfitrion. Se valida con la clave del link y solo desde la
  red de la casa (ver _tv_fila_por_clave en app.py).
  Compatibilidad: el navegador de webOS 5 es un Chromium viejo (~68): nada de
  `gap` en flexbox, `aspect-ratio`, `inset`, `?.` ni `??`.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --card: rgba(13,13,13,0.78); --border: rgba(255,255,255,0.08);
    --gold: #C8920A; --gold2: #F5C518; --text: #efefef; --text2: #9a9a9a; --text3: #555;
    --led-yellow:#f5c518; --led-white:#f0f0f0; --led-cyan:#00d4ff; --led-red:#ff2244;
    --led-green:#00e676; --led-blue:#2979ff; --led-magenta:#e040fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: Inter, system-ui, sans-serif; cursor: none; }
  .fondo { position: fixed; top: -8%; left: -8%; width: 116%; height: 116%; background: #000 center/cover no-repeat;
    filter: blur(60px) brightness(0.32) saturate(1.3); -webkit-filter: blur(60px) brightness(0.32) saturate(1.3);
    transition: background-image 1.2s; }
  .velo { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at 30% 40%, rgba(0,0,0,0.15), rgba(0,0,0,0.75)); }
  .tv { position: relative; width: 100%; height: 100%; padding: 2.6vw 3vw 2.2vw; display: flex; flex-direction: column; }

  /* ---------- barra superior ---------- */
  .top { display: flex; align-items: center; height: 6.2vw; }
  .marca { width: 22vw; display: flex; align-items: center; }
  .marca img { height: 3.8vw; }
  .reloj { flex: 1; display: flex; flex-direction: column; align-items: center; font-family: Orbitron, sans-serif; color: var(--gold); }
  .reloj-hora { display: flex; align-items: center; font-size: 1.9vw; font-weight: 600; }
  .dig { display: inline-block; width: 1.3em; margin: 0 0.05em; text-align: center; line-height: 1.6;
    background: #110e07; border: 1px solid #2a2109; border-radius: 0.18em; }
  .sep { display: inline-block; width: 0.5em; text-align: center; opacity: .4; }
  .reloj-fecha { margin-top: 0.45vw; font-size: 0.95vw; font-weight: 600; letter-spacing: .16em; opacity: .8; }
  .union { width: 22vw; display: flex; align-items: center; justify-content: flex-end; }
  .union .txt { text-align: right; margin-right: 1vw; }
  .union .k { font-size: 0.95vw; color: var(--text2); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .union .code { font-family: Orbitron, sans-serif; color: var(--gold2); font-size: 2vw; letter-spacing: .12em; margin-top: 0.2vw; }
  .union img { width: 6.2vw; height: 6.2vw; background: #fff; border-radius: 0.5vw; padding: 0.3vw; }

  /* ---------- centro ---------- */
  .main { flex: 1; display: flex; align-items: center; min-height: 0; padding: 1.6vw 0; }
  .cover { width: 33vw; height: 33vw; max-height: 100%; border-radius: 1.4vw; background: #161616 center/cover no-repeat;
    box-shadow: 0 2vw 5vw rgba(0,0,0,0.6); flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 8vw; color: var(--text3); }
  .info { flex: 1; min-width: 0; padding: 0 3vw; }
  .etq { font-size: 1vw; letter-spacing: .22em; color: var(--gold); font-weight: 700; text-transform: uppercase; }
  .titulo { font-family: Orbitron, sans-serif; font-size: 3.6vw; line-height: 1.18; margin-top: 0.8vw;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .artista { font-size: 2.2vw; color: var(--gold2); margin-top: 0.9vw; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { font-size: 1.35vw; color: var(--text2); margin-top: 0.5vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .formato { display: inline-flex; align-items: center; margin-top: 1.1vw; padding: 0.35vw 1vw; border: 1px solid currentColor;
    border-radius: 999px; font-size: 1vw; font-weight: 600; }
  .formato .led { width: 0.6vw; height: 0.6vw; border-radius: 50%; margin-right: 0.6vw; }
  .progreso { margin-top: 2vw; max-width: 46vw; }
  .barra { height: 0.45vw; background: rgba(255,255,255,0.12); border-radius: 1vw; overflow: hidden; }
  .barra span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--gold2));
    transition: width 0.9s linear; }
  .tiempos { display: flex; justify-content: space-between; margin-top: 0.6vw; font-size: 1.05vw; color: var(--text2); }
  .tiempos .pausa { color: var(--gold2); font-weight: 600; }
  .por { display: inline-flex; align-items: center; margin-top: 2vw; padding: 0.5vw 1.6vw 0.5vw 0.5vw;
    background: var(--card); border: 1px solid rgba(200,146,10,0.4); border-radius: 999px; }
  .por .av { width: 3.6vw; height: 3.6vw; font-size: 1.3vw; margin-right: 1vw; }
  .por .k { font-size: 0.8vw; letter-spacing: .18em; color: var(--text2); font-weight: 700; }
  .por .v { font-size: 1.7vw; font-weight: 700; color: var(--gold2); margin-top: 0.15vw; }

  .sig { width: 27vw; flex-shrink: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
  .sig h3 { font-size: 1vw; letter-spacing: .22em; color: var(--text2); font-weight: 700; margin-bottom: 1vw; }
  .item { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border);
    border-radius: 1vw; padding: 0.8vw; margin-bottom: 0.9vw; }
  .item .c { width: 5vw; height: 5vw; border-radius: 0.6vw; background: #161616 center/cover no-repeat; flex-shrink: 0;
    margin-right: 1vw; }
  .item .t { min-width: 0; flex: 1; }
  .item .n { font-size: 1.25vw; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .a { font-size: 1vw; color: var(--text2); margin-top: 0.2vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .b { display: flex; align-items: center; margin-top: 0.45vw; font-size: 0.95vw; color: var(--gold2); font-weight: 600; }
  .item .b .av { width: 1.6vw; height: 1.6vw; font-size: 0.6vw; margin-right: 0.5vw; }

  /* ---------- pie ---------- */
  .pie { height: 5vw; display: flex; align-items: center; border-top: 1px solid var(--border); padding-top: 1vw; }
  .stats { display: flex; margin-right: 2.5vw; }
  .stat { margin-right: 2.2vw; }
  .stat .v { font-family: Orbitron, sans-serif; font-size: 1.9vw; color: var(--gold2); }
  .stat .l { font-size: 0.85vw; color: var(--text2); letter-spacing: .1em; text-transform: uppercase; margin-top: 0.2vw; }
  .ranking { flex: 1; display: flex; align-items: center; overflow: hidden; }
  .ranking .k { font-size: 0.9vw; letter-spacing: .18em; color: var(--text2); font-weight: 700; margin-right: 1.2vw; white-space: nowrap; }
  .rk { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 0.3vw 1.1vw 0.3vw 0.3vw; margin-right: 0.9vw; white-space: nowrap; }
  .rk .pos { font-family: Orbitron, sans-serif; color: var(--gold); font-size: 1vw; margin: 0 0.6vw 0 0.4vw; }
  .rk .av { width: 2.2vw; height: 2.2vw; font-size: 0.8vw; margin-right: 0.6vw; }
  .rk .nm { font-size: 1.1vw; font-weight: 600; }
  .rk .ct { font-size: 1vw; color: var(--gold2); font-weight: 700; margin-left: 0.6vw; }
  .rk.primero { border-color: rgba(245,197,24,0.55); }

  .av { border-radius: 50%; background: var(--gold); color: #000; font-weight: 800; display: inline-flex;
    align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .admin { display: inline-block; font-size: 0.65em; font-weight: 800; background: var(--gold2); color: #000;
    border-radius: 0.25em; padding: 0.05em 0.4em; margin-left: 0.5em; vertical-align: 0.15em; letter-spacing: .02em; }

  /* ---------- avisos "X sumó Y" ---------- */
  .avisos { position: fixed; left: 39vw; bottom: 8.6vw; width: 30vw; }
  .aviso { display: flex; align-items: center; background: rgba(20,16,6,0.94); border: 1px solid rgba(245,197,24,0.55);
    border-radius: 1vw; padding: 0.8vw 1.2vw 0.8vw 0.8vw; margin-top: 0.7vw; box-shadow: 0 1vw 3vw rgba(0,0,0,0.6);
    opacity: 0; transform: translateY(1vw); transition: opacity .45s, transform .45s; }
  .aviso.ver { opacity: 1; transform: translateY(0); }
  .aviso .av { width: 3vw; height: 3vw; font-size: 1vw; margin-right: 1vw; }
  .aviso .q { font-size: 1.15vw; color: var(--gold2); font-weight: 700; }
  .aviso .w { font-size: 1.15vw; margin-top: 0.15vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aviso .w span { color: var(--text2); }

  /* ---------- espera / bienvenida ---------- */
  .espera { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .espera h1 { font-family: Orbitron, sans-serif; color: var(--gold2); font-size: 3vw; }
  .espera p { font-size: 1.5vw; color: var(--text2); margin-top: 1vw; }
  .espera img { width: 17vw; height: 17vw; background: #fff; border-radius: 1vw; padding: 0.8vw; margin-top: 2.5vw; }
  .espera .code { font-family: Orbitron, sans-serif; color: var(--gold2); font-size: 3.4vw; letter-spacing: .14em; margin-top: 1.5vw; }
  .oculto { display: none !important; }
  .conexion { position: fixed; right: 1.4vw; bottom: 1vw; font-size: 0.8vw; color: var(--text3); }
</style>
</head>
<body>
<div class="fondo" id="fondo"></div>
<div class="velo"></div>
<div class="tv">
  <div class="top">
    <div class="marca"><img src="/static/logo-header.png" alt="Orbyte"></div>
    <div class="reloj"><div class="reloj-hora" id="reloj-hora"></div><div class="reloj-fecha" id="reloj-fecha">--‑--‑----</div></div>
    <div class="union oculto" id="union">
      <div class="txt"><div class="k">Súmate con tu canción</div><div class="code" id="union-code"></div></div>
      <img id="union-qr" alt="">
    </div>
  </div>

  <div class="main" id="main">
    <div class="cover" id="cover">♪</div>
    <div class="info">
      <div class="etq">Sonando ahora</div>
      <div class="titulo" id="titulo"></div>
      <div class="artista" id="artista"></div>
      <div class="album" id="album"></div>
      <div class="formato oculto" id="formato"><span class="led" id="led"></span><span id="formato-txt"></span></div>
      <div class="progreso">
        <div class="barra"><span id="barra"></span></div>
        <div class="tiempos"><span id="pos">0:00</span><span class="pausa" id="pausa"></span><span id="dur">0:00</span></div>
      </div>
      <div class="por oculto" id="por"></div>
    </div>
    <div class="sig oculto" id="sig"><h3>A CONTINUACIÓN</h3><div id="sig-lista"></div></div>
  </div>

  <div class="espera" id="espera">
    <h1 id="espera-t">Súmate a la playlist</h1>
    <p id="espera-p">Escanea el código con tu teléfono y agrega tus canciones</p>
    <img id="espera-qr" alt="">
    <div class="code" id="espera-code"></div>
  </div>

  <div class="pie oculto" id="pie">
    <div class="stats">
      <div class="stat"><div class="v" id="st-total">0</div><div class="l">Agregadas</div></div>
      <div class="stat"><div class="v" id="st-sonaron">0</div><div class="l">Ya sonaron</div></div>
    </div>
    <div class="ranking" id="ranking"></div>
  </div>
</div>
<div class="avisos" id="avisos"></div>
<div class="conexion" id="conexion"></div>

<script>
(function () {
  "use strict";
  var CLAVE = {{ clave|tojson }};
  var BASE = "/tv/" + encodeURIComponent(CLAVE);
  var $ = function (id) { return document.getElementById(id); };
  var LED = { yellow: "var(--led-yellow)", white: "var(--led-white)", cyan: "var(--led-cyan)", red: "var(--led-red)",
              green: "var(--led-green)", blue: "var(--led-blue)", magenta: "var(--led-magenta)" };
  var estado = null, recibidoEn = 0, desde = null, trackId = null, codeActual = null;
  var colaAvisos = [], mostrandoAviso = false;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmt(seg) {
    seg = Math.max(0, Math.floor(seg || 0));
    return Math.floor(seg / 60) + ":" + ("0" + (seg % 60)).slice(-2);
  }
  function avatar(av, nombre, clase) {
    av = av || {};
    var cls = "av" + (clase ? " " + clase : "");
    if (av.type === "image" && av.url) return '<span class="' + cls + '"><img src="' + esc(av.url) + '" alt=""></span>';
    if (av.type === "infinito") return '<span class="' + cls + '">∞</span>';
    var txt = av.text || String(nombre || "?").slice(0, 2).toUpperCase();
    return '<span class="' + cls + '">' + esc(txt) + "</span>";
  }
  function adminTag(av) { return av && av.badge === "admin" ? '<span class="admin">Admin</span>' : ""; }
  function fondo(el, url) { el.style.backgroundImage = url ? 'url("' + url + '")' : ""; if (el.id === "cover") el.textContent = url ? "" : "♪"; }

  // Reloj igual al del player /mini: placas de ancho fijo, 24 h + fecha.
  var placas = [];
  (function () {
    var h = $("reloj-hora");
    "00:00:00".split("").forEach(function (c) {
      var s = document.createElement("span");
      s.className = c === ":" ? "sep" : "dig";
      s.textContent = c;
      h.appendChild(s);
      if (c !== ":") placas.push(s);
    });
  })();
  function reloj() {
    var d = new Date(), z = function (n) { return ("0" + n).slice(-2); };
    var cifras = z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
    for (var i = 0; i < 6; i++) if (placas[i].textContent !== cifras[i]) placas[i].textContent = cifras[i];
    var f = z(d.getDate()) + "-" + z(d.getMonth() + 1) + "-" + d.getFullYear();
    if ($("reloj-fecha").textContent !== f) $("reloj-fecha").textContent = f;
  }
  reloj(); setInterval(reloj, 1000);

  function posicion() {
    var s = estado && estado.sonando;
    if (!s) return 0;
    var p = s.position || 0;
    if (s.playing) p += (Date.now() - recibidoEn) / 1000;
    return s.duration ? Math.min(p, s.duration) : p;
  }
  function tickProgreso() {
    var s = estado && estado.sonando;
    if (!s) return;
    var p = posicion();
    $("barra").style.width = (s.duration ? Math.min(100, p / s.duration * 100) : 0) + "%";
    $("pos").textContent = fmt(p);
  }
  setInterval(tickProgreso, 500);

  function pintar() {
    var e = estado, colab = e.colab, s = e.sonando;
    // Unirse (solo playlist colaborativa)
    if (colab && colab.code !== codeActual) {
      codeActual = colab.code;
      var qr = BASE + "/qr.png?c=" + encodeURIComponent(colab.code || "");
      $("union-qr").src = qr; $("espera-qr").src = qr;
      $("union-code").textContent = colab.code || ""; $("espera-code").textContent = colab.code || "";
    }
    $("union").classList.toggle("oculto", !colab || !s);
    $("pie").classList.toggle("oculto", !colab);
    // Espera / bienvenida
    $("main").classList.toggle("oculto", !s);
    $("espera").style.display = s ? "none" : "flex";
    if (!s) {
      $("espera-t").textContent = !e.activa ? "Modo TV desactivado" : (colab ? "Súmate a la playlist" : "Nada sonando por ahora");
      $("espera-p").textContent = colab ? "Escanea el código con tu teléfono y agrega tus canciones" : "";
      $("espera-qr").classList.toggle("oculto", !colab);
      $("espera-code").classList.toggle("oculto", !colab);
      fondo($("fondo"), "");
    } else {
      var t = s.track;
      if (t.id !== trackId) {
        trackId = t.id;
        fondo($("cover"), t.cover_url); fondo($("fondo"), t.cover_url);
        $("titulo").textContent = t.title || "";
        $("artista").textContent = t.artist_name || "";
        $("album").textContent = (t.album_name || "") + (t.album_year ? " · " + t.album_year : "");
        var c = LED[t.format_color] || "";
        $("formato").classList.toggle("oculto", !t.format_display);
        $("formato-txt").textContent = t.format_display || "";
        $("led").style.background = c || "var(--text2)";
        $("formato").style.color = c ? "var(--text)" : "var(--text2)";
      }
      // "Agregada por": solo en playlist colaborativa
      var por = $("por"), porHtml = "";
      if (e.modo === "colab" && t.added_by) {
        porHtml = avatar(t.added_by_avatar, t.added_by) +
          '<div><div class="k">AGREGADA POR</div><div class="v">' + esc(t.added_by) + adminTag(t.added_by_avatar) + "</div></div>";
      }
      por.classList.toggle("oculto", !porHtml);
      if (por.getAttribute("data-h") !== porHtml) { por.setAttribute("data-h", porHtml); por.innerHTML = porHtml; }
      $("dur").textContent = fmt(s.duration);
      $("pausa").textContent = s.playing ? "" : "En pausa";
      tickProgreso();
      // Próximas 3
      var lista = e.siguientes || [];
      $("sig").classList.toggle("oculto", !lista.length);
      var sigHtml = lista.map(function (n) {
        return '<div class="item"><div class="c" style="background-image:url(\'' + esc(n.cover_url || "") + '\')"></div>' +
          '<div class="t"><div class="n">' + esc(n.title) + '</div><div class="a">' + esc(n.artist_name || "") + "</div>" +
          (e.modo === "colab" && n.added_by ? '<div class="b">' + avatar(n.added_by_avatar, n.added_by) + esc(n.added_by) + adminTag(n.added_by_avatar) + "</div>" : "") +
          "</div></div>";
      }).join("");
      if ($("sig-lista").getAttribute("data-h") !== sigHtml) { $("sig-lista").setAttribute("data-h", sigHtml); $("sig-lista").innerHTML = sigHtml; }
    }
    // Estadísticas
    if (colab) {
      $("st-total").textContent = colab.total;
      $("st-sonaron").textContent = colab.sonaron;
      var rkHtml = (colab.ranking.length ? '<span class="k">MÁS ACTIVOS</span>' : "") +
        colab.ranking.map(function (r, i) {
          return '<span class="rk' + (i === 0 ? " primero" : "") + '"><span class="pos">' + (i + 1) + "</span>" +
            avatar(r.avatar, r.name) + '<span class="nm">' + esc(r.name) + adminTag(r.avatar) + '</span><span class="ct">' + r.total + "</span></span>";
        }).join("");
      if ($("ranking").getAttribute("data-h") !== rkHtml) { $("ranking").setAttribute("data-h", rkHtml); $("ranking").innerHTML = rkHtml; }
    }
  }

  // Avisos "X sumó Y": de a uno, 6 s cada uno.
  function encolarAvisos(evs) {
    evs.forEach(function (ev) { colaAvisos.push(ev); });
    if (colaAvisos.length > 6) colaAvisos = colaAvisos.slice(-6);
    siguienteAviso();
  }
  function siguienteAviso() {
    if (mostrandoAviso || !colaAvisos.length) return;
    mostrandoAviso = true;
    var ev = colaAvisos.shift();
    var d = document.createElement("div");
    d.className = "aviso";
    d.innerHTML = avatar(ev.avatar, ev.by) + '<div style="min-width:0"><div class="q">' + esc(ev.by) + adminTag(ev.avatar) +
      ' sumó</div><div class="w">' + esc(ev.title) + (ev.artist ? " <span>· " + esc(ev.artist) + "</span>" : "") + "</div></div>";
    $("avisos").appendChild(d);
    setTimeout(function () { d.classList.add("ver"); }, 30);
    setTimeout(function () {
      d.classList.remove("ver");
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); mostrandoAviso = false; siguienteAviso(); }, 500);
    }, 6000);
  }

  var fallos = 0;
  function consultar() {
    var url = BASE + "/estado" + (desde != null ? "?desde=" + desde : "");
    fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (e) {
      fallos = 0; $("conexion").textContent = "";
      estado = e; recibidoEn = Date.now();
      if (e.colab) {
        if (desde != null && e.colab.eventos && e.colab.eventos.length) encolarAvisos(e.colab.eventos);
        desde = Math.max(desde || 0, e.colab.ultimo_item || 0);
      } else { desde = null; codeActual = null; }
      pintar();
    }).catch(function () {
      fallos += 1;
      if (fallos >= 3) $("conexion").textContent = "Reconectando con Orbyte…";
    });
  }
  consultar(); setInterval(consultar, 2500);
  // Recarga suave cada 6 h por si el navegador de la tele acumula memoria.
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
  // Que la tele no apague la pantalla mientras se muestra (si lo soporta).
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (err) {}
})();
</script>
